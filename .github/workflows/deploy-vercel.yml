# Build on GitHub (more RAM than Vercel Hobby), then upload to Vercel.
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify secrets
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            val="${!key}"
            if [ -z "$val" ]; then
              echo "::error::$key is empty — check repo Actions secrets"
              missing=1
            else
              echo "$key is set (len=${#val})"
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json
          echo "Linked project.json:"
          cat .vercel/project.json

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vite
        run: |
          # Prefer production env pulled from Vercel (Vite reads .env.production)
          if [ -f .vercel/.env.production.local ]; then
            cp .vercel/.env.production.local .env.production
          fi
          npm run build

      - name: Package Build Output API
        run: |
          # Static Vite → Vercel Build Output API so --prebuilt works without `vercel build`
          mkdir -p .vercel/output/static
          cp -R dist/. .vercel/output/static/
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path(".vercel/output/config.json").write_text(
              json.dumps(
                  {
                      "version": 3,
                      "routes": [
                          {"handle": "filesystem"},
                          {"src": "/(.*)", "dest": "/index.html"},
                      ],
                  }
              )
          )
          PY

      - name: Deploy prebuilt
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
