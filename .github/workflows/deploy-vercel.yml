# Build on GitHub (more RAM than Vercel Hobby), then upload prebuilt output.
# Secrets required: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Optional (recommended): VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify secrets
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            val="${!key}"
            if [ -z "$val" ]; then
              echo "::error::$key is empty — check repo Actions secrets"
              missing=1
            else
              echo "$key is set (len=${#val})"
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build with Vite
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Package Build Output API
        run: |
          mkdir -p .vercel/output/static
          cp -R dist/. .vercel/output/static/
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path(".vercel/output/config.json").write_text(
              json.dumps(
                  {
                      "version": 3,
                      "routes": [
                          {"handle": "filesystem"},
                          {"src": "/(.*)", "dest": "/index.html"},
                      ],
                  }
              )
          )
          Path(".vercel/project.json").write_text(
              json.dumps(
                  {
                      "orgId": __import__("os").environ["VERCEL_ORG_ID"].strip(),
                      "projectId": __import__("os").environ["VERCEL_PROJECT_ID"].strip(),
                  }
              )
          )
          print("project.json:", Path(".vercel/project.json").read_text())
          PY

      - name: Deploy prebuilt
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
