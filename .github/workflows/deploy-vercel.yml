# Build on GitHub (more RAM than Vercel Hobby), then upload static dist.
# Secrets required: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Optional: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify secrets
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            val="${!key}"
            if [ -z "$val" ]; then
              echo "::error::$key is empty — check repo Actions secrets"
              missing=1
            else
              echo "$key is set (len=${#val})"
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build with Vite
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Link project + deploy static dist
        run: |
          mkdir -p .vercel
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(".vercel/project.json").write_text(
              json.dumps(
                  {
                      "orgId": os.environ["VERCEL_ORG_ID"].strip(),
                      "projectId": os.environ["VERCEL_PROJECT_ID"].strip(),
                  }
              )
          )
          PY
          cp vercel.json dist/vercel.json
          # Upload already-built files only — do not let Vercel run vite build remotely.
          vercel deploy dist --prod --yes --token="$VERCEL_TOKEN" --meta gitSha="${GITHUB_SHA}"
