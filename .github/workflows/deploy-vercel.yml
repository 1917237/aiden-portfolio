# Build on GitHub, disable Vercel remote build, upload static dist.
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Optional: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify secrets
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            val="${!key}"
            if [ -z "$val" ]; then
              echo "::error::$key is empty"
              missing=1
            else
              echo "$key is set (len=${#val})"
            fi
          done
          exit "$missing"

      - name: Disable Vercel remote build + cancel stuck deploys
        run: |
          python3 <<'PY'
          import json, os, urllib.request

          token = os.environ["VERCEL_TOKEN"].strip()
          org = os.environ["VERCEL_ORG_ID"].strip()
          project = os.environ["VERCEL_PROJECT_ID"].strip()

          def req(url, method="GET", body=None):
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(r) as resp:
                  return json.loads(resp.read().decode() or "{}")

          patched = req(
              f"https://api.vercel.com/v9/projects/{project}?teamId={org}",
              method="PATCH",
              body={
                  "framework": None,
                  "buildCommand": "",
                  "installCommand": "",
                  "outputDirectory": "",
                  "commandForIgnoringBuildStep": "exit 0",
              },
          )
          print(
              "project settings:",
              {
                  "framework": patched.get("framework"),
                  "buildCommand": patched.get("buildCommand"),
                  "installCommand": patched.get("installCommand"),
                  "ignore": patched.get("commandForIgnoringBuildStep"),
              },
          )

          deps = req(
              f"https://api.vercel.com/v6/deployments?projectId={project}&teamId={org}&limit=10"
          ).get("deployments", [])
          for d in deps:
              state = d.get("readyState") or d.get("state")
              uid = d["uid"]
              print(f"{uid} {state}")
              if state in ("BUILDING", "QUEUED", "INITIALIZING", "ANALYZING"):
                  try:
                      req(
                          f"https://api.vercel.com/v12/deployments/{uid}/cancel?teamId={org}",
                          method="PATCH",
                          body={},
                      )
                      print("cancelled", uid)
                  except Exception as e:
                      print("cancel failed", uid, e)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Build with Vite
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy static dist
        run: |
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json
          cp vercel.json dist/vercel.json
          vercel deploy dist --prod --yes --token="$VERCEL_TOKEN"
